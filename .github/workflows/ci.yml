name: CI
on:
  push:
    branches: [main, feat/**]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@main
    with:
      rust-version: 'stable'
      # Coverage disabled on this branch — tarpaulin's instrumented
      # subprocess crashes with "Test failed during run" after the
      # lib tests cleanly report 41/0. Plain `cargo test` is green.
      # Same workaround applied to rssgen feat/v0.0.5 in round-3.
      # Codecov badge will stay at the last main-branch value until
      # the tarpaulin crash is root-caused (tarpaulin upgrade or
      # per-test `#[cfg(not(coverage))]` guard).
      run-coverage: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    uses: sebastienrousseau/pipelines/.github/workflows/security.yml@main
    with:
      language: rust

  docs:
    if: github.ref == 'refs/heads/main'
    uses: sebastienrousseau/pipelines/.github/workflows/docs.yml@main
    with:
      type: rust
      # Writes a CNAME file into the Pages artifact. Without it the
      # deployed site carries no custom domain, and doc.sitemap-gen.co
      # served a GitHub 404 even though the repository's Pages settings
      # named that domain -- the artifact is what actually binds it.
      cname: doc.sitemap-gen.co
      redirect-crate: sitemap-gen
